<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation - Burgers and Curry House</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .confirmation-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .success-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .order-details {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            margin: 25px 0;
            text-align: left;
            border-left: 5px solid #FF6B35;
        }
        .order-details h2 {
            color: #333;
            font-size: 1.2em;
            margin-bottom: 15px;
            border-bottom: 2px solid #FF6B35;
            padding-bottom: 10px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 1.05em;
            color: #555;
        }
        .detail-row strong {
            color: #333;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #ddd;
            font-size: 1.3em;
            font-weight: bold;
            color: #FF6B35;
        }
        .discount-badge {
            background: #FFE5CC;
            color: #FF6B35;
            padding: 10px 15px;
            border-radius: 5px;
            margin: 15px 0;
            font-weight: bold;
            display: inline-block;
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 107, 53, 0.4);
        }
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #d0d0d0;
        }
    </style>
</head>
<body>
    <div class="confirmation-container">
        <div class="success-icon">✅</div>
        <h1>Order Confirmed!</h1>
        <p style="color: #666; margin-bottom: 20px;">Thank you for your order at Burgers and Curry House!</p>

        <div class="order-details">
            <h2>Order Summary</h2>
            <div class="detail-row">
                <strong>Item:</strong>
                <span th:text="${orderItem.getItemName()}"></span>
            </div>
            <div class="detail-row">
                <strong>Quantity:</strong>
                <span th:text="${orderItem.getQuantity()}"></span>
            </div>
            <div class="detail-row">
                <strong>Unit Price:</strong>
                <span th:text="'$' + ${orderItem.getItem().getBasePrice()}"></span>
            </div>
            
            <div th:if="${isRiceDiscount}" class="discount-badge">
                💰 $2 Discount Applied!
            </div>
            
            <div class="total-row">
                <span>Total:</span>
                <span th:text="'$' + ${orderItem.getTotalPrice()}"></span>
            </div>
        </div>

        <div class="button-group">
            <a href="/" class="btn btn-secondary">← Continue Shopping</a>
            <button class="btn btn-primary" onclick="alert('Order submitted! Thank you for your purchase.')">Place Order</button>
        </div>
    </div>
</body>
</html>
